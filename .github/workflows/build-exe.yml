name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter matplotlib pyinstaller
        # If you have a requirements.txt file, uncomment the line below:
        # if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --collect-all customtkinter `
          --collect-all matplotlib `
          --name "InventoryManagementSystem" `
          main.py
      # Note: Change 'main.py' to your main entry point script (e.g., app.py)

    - name: Zip the Output Directory
      run: |
        Compress-Archive -Path dist/InventoryManagementSystem/* -DestinationPath InventoryManagementSystem-Windows.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Inventory-Management-System-Exe
        path: InventoryManagementSystem-Windows.zip
        
