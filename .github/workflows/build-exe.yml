name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0, v1.0.0)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # Grants GitHub Actions permission to publish releases

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter matplotlib pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --add-data "imgs;imgs" `
          --collect-all customtkinter `
          --collect-all matplotlib `
          --name "InventoryManagementSystem" `
          main.py

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/InventoryManagementSystem.exe
        name: "Release ${{ github.ref_name }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
